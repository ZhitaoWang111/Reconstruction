<style>

:var(--accent)}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats b{font-size:28px;display:block}.stats div{background:#eef5f1;padding:12px 20px;border-radius:9px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 monospace;background:#f3f5f4;padding:12px;max-height:430px;overflow:auto}.full-input{max-height:none;overflow:visible}details{margin:12px 0}summary{cursor:pointer;color:var(--accent)}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.warn{background:#fff5de;border-left:4px solid #dca744;padding:12px}.footer{display:flex;justify-content:space-between;margin-top:18px}.footer button{padding:9px 18px;border:1px solid var(--line);border-radius:7px;background:white}.crops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.crops img{height:150px;width:100%;object-fit:contain;background:#eef1ef}canvas{width:100%;height:420px;display:block;background:#0c1821;border-radius:9px;touch-action:none}select{max-width:100%;padding:7px;border:1px solid var(--line);border-radius:6px}.sub{font-size:13px}.trace{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}.trace img{max-height:200px;object-fit:contain;width:100%}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #e4ac35;outline-offset:2px}@media(max-width:800px){.layout{display:block;padding:12px}nav{position:static;display:flex;overflow:auto;margin-bottom:12px}nav button{min-width:150px}.panel{padding:16px}.grid{grid-template-columns:1fr}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.crops{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:25px}header{padding:24px}.frame img{height:80px}}

<header><div class="eyebrow">HARNESS / FIRST WINDOW / EXECUTION WALKTHROUGH</div><h1>跟着五帧，走完一次物体记忆更新</h1><p>左侧按执行顺序读；中间查看真实输入、工具取证和状态变化。所有记录只取第一次成功提交的窗口。</p><a href="../../../../docs/scene-reconstruction-discussions.html#round-08">对照讨论页框架图 ↗</a></header>
<div class="layout"><nav id="nav" aria-label="执行阶段"></nav><main><div class="panel"><div class="eyebrow" style="color:var(--accent)" id="stageLabel"></div><h2 id="title"></h2><div id="content"></div><div class="trace"><h3>固定跟踪一个 mask：它在这一步是什么状态？</h3><select id="traceSelect" aria-label="选择跟踪的 mask"></select><div id="trace"></div></div><div class="footer"><button id="prev">← 上一步</button><button id="next">下一步 →</button></div></div></main></div>
<script src="window01_walkthrough.js"></script><script>
const D=WALKTHROUGH,obs=Object.values(D.observations),S=D.state,$=id=>document.getElementById(id);let stage=0,frame=0,tracked=obs[0].id;
const titles=['启动与配置','整理五帧观测','恢复窗口前状态','组装模型输入','模型实际调用了什么','按归属生成物体点云','正式提交版本','输出与下一窗口'];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const code=(file,line,fn)=>`<div class="code">InstanceRecognition/src/harness/${file}:${line} · ${esc(fn)}</div>`;
const detail=(title,value)=>`<details><summary>${esc(title)}</summary><pre>${esc(typeof value==='string'?value:JSON.stringify(value,null,2))}</pre></details>`;
const strip=()=>`<div class="strip">${[0,1,2,3,4].map(i=>{const o=obs.find(x=>x.seq===i);return `<button class="frame ${i===frame?'active':''}" data-frame="${i}"><img src="${esc(o.image)}" alt="抽样帧 ${i}"><small>抽样 ${i} / 原始 ${o.source_frame_id}</small><small>${obs.filter(x=>x.seq===i).length} 个 mask</small></button>`}).join('')}</div>`;
function trace(){const o=D.observations[tracked],a=S.assignments[tracked];const status=stage<2?'已读取原始观测；尚无物体归属':stage<4?'作为新观测输入；正式物体记忆仍为空':stage===4?`第 2 轮提案给出 ${a.object_id||a.status}，第 3 轮请求提交`:stage===5?`按待提交归属 ${a.object_id||a.status} 生成临时版本点云`:`正式记录为 ${a.object_id||a.status}`;
$('trace').innerHTML=`<div class="grid"><div><p><b>${esc(o.id)} · ${esc(o.category_label)}</b></p><p>${esc(status)}</p>${stage>=4?`<p class="sub">模型理由：${esc(a.reason)}</p><p class="muted">引用证据：${esc(a.evidence.join(', '))}</p>`:`<p class="muted">该 mask 有 ${o.point_count.toLocaleString()} 个有效原始点。以下图片是保存的局部证据。</p>`}</div><img src="${o.crop}" alt="${esc(o.id)} 的局部 mask 证据"></div>`;}
function render(){document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('active',i===stage));$('title').textContent=titles[stage];$('stageLabel').textContent=`STEP ${String(stage+1).padStart(2,'0')} / 08`;
let h='';if(stage===0){h=`<p>这次运行直接复用已经生成的类别、mask 和世界坐标点。本页只复盘第一个窗口：抽样序号 0–4，而非原视频连续五帧。</p>${strip()}<div class="stats"><div><b>5</b>本窗抽样帧</div><div><b>${obs.length}</b>mask 观测</div><div><b>14</b>每窗调用上限</div><div><b>2 cm</b>融合体素尺寸</div></div><div class="flow"><span class="pill">锁定输出目录</span><span class="arrow">→</span><span class="pill">核对配置 / 哈希</span><span class="arrow">→</span><span class="pill">准备观测</span></div>${code('run.py',15,'main()')}${detail('本次保存的配置',D.config)}<p class="muted">图像和状态来自既有运行记录；页面不会发起 API 请求。</p>`;}
if(stage===1){h=`<p>程序从 NPZ 的 <code>points_world</code> 与 <code>mask_bits</code> 中取出每个 mask 的三维点，并为其分配独立的观测 ID。切换帧查看具体条目。</p>${strip()}<img class="hero" src="evidence/frame_${String(frame).padStart(4,'0')}.jpg" alt="当前帧带观测 ID 的标注图"><div class="table"><table><tr><th>观测 ID</th><th>已有类别</th><th>有效点数</th><th>世界坐标中心 / m</th></tr>${obs.filter(o=>o.seq===frame).map(o=>`<tr><td><button data-track="${o.id}">${o.id}</button></td><td>${esc(o.category_label)}</td><td>${o.point_count}</td><td>${o.centroid?o.centroid.map(x=>x.toFixed(2)).join(', '):'无有效点'}</td></tr>`).join('')}</table></div>${code('observations.py',22,'Observations.__init__()')}${code('observations.py',57,'Observations.view()')}`;}
if(stage===2){h=`<p>这是第一个窗口，没有历史物体，也没有历史代表图。程序建立空状态；此前准备的观测仍作为只读证据保存。</p><div class="flow"><span class="pill">version = 0</span><span class="pill">cutoff = −1</span><span class="pill">objects = {}</span><span class="pill">assignments = {}</span></div><div class="grid"><div class="card"><h3>程序已准备</h3><p>整个试验的 30 帧输入及裁剪图。</p></div><div class="card"><h3>当前模型可访问</h3><p>仅抽样 0–4 的 ${obs.length} 个观测；工具拒绝读取后续帧。</p></div></div>${code('state.py',19,'initial()')}${code('run.py',45,'checkpoint / state 恢复')}${code('tools.py',25,'observe()：cutoff 检查')}<p class="warn">初始空状态按当前代码重建示意，不是额外保存的一份 version 0 文件。</p>`;}
if(stage===3){h=`<p>以下来自本窗口成功尝试的实际请求日志，按发送顺序列出。可切换三轮请求：第 1 轮是初始输入，第 2、3 轮包含此前对话、工具返回与追加图片。</p><label>查看请求 <select id="requestSelect" aria-label="选择实际模型请求">${D.requests.map((r,i)=>`<option value="${i}">第 ${i+1} 轮${i===0?' · 初次输入':i===1?' · 追加取证结果':' · 追加提案校验结果'}</option>`).join('')}</select></label><div id="requestContent"></div>${code('run.py',47,'窗口输入构建')}${code('run.py',61,'模型与工具对话循环')}${code('client.py',54,'Client.call()：请求参数')}<p class="warn">本区为历史请求原文，所以 JSON 中保留当时发送的绝对路径；它们只是文本字段，不赋予模型读取本地文件的能力。请求日志将图片编码替换成占位符；本页按消息顺序与工具记录关联展示保存的 evidence 图片。点云数组、深度图、相机矩阵和未来帧没有放进本次请求。</p>`;}
if(stage===4){h=`<p>成功提交的这次尝试实际用了 <b>3 轮 API 调用</b>，约 ${D.timing.elapsed_seconds.toFixed(1)} 秒。下面按调用顺序展开，前面未提交的重试不混入本次过程。</p><p class="muted">记录前缀：${D.run_prefix}。第一轮返回四个工具请求，程序依次执行后一起返回结果。</p>`;
D.calls.forEach(c=>{h+=`<div class="card"><div class="eyebrow" style="color:var(--accent)">API ROUND ${c.round}</div><h3>${esc(c.name)}</h3>`;if(c.name==='inspect_observations'){h+=`<p>模型请求查看：${esc(c.arguments.ids.join('、'))}</p><div class="crops">${c.images.map((img,i)=>`<div><img src="${esc(img)}" alt="工具返回裁剪 ${esc(c.arguments.ids[i])}"><small>${esc(c.arguments.ids[i])}</small></div>`).join('')}</div><p class="muted">程序返回这些裁剪图和对应观测信息，供下一轮模型判断。</p>`;}else if(c.name==='propose_update'){h+=`<p>提案创建 ${Object.keys(S.objects).length} 个候选；${obs.length-2} 个观测归属到物体，2 个观测留待处理。校验通过，但此时尚未写入正式状态。</p>${detail('展开实际提案：每一步修改及理由',D.transaction.proposal)}<p class="muted">proposal_id：${c.result.proposal_id}</p>`;}else{h+=`<p>模型使用已校验的 proposal_id 请求提交。主循环完成下一阶段的点云生成与落盘后，返回版本 1。</p>${detail('提交参数与最终工具返回',{arguments:c.arguments,result:c.result})}`;}h+=`<a href="${c.log}" class="sub">查看该工具的原始记录 ↗</a></div>`;});h+=`<p class="warn">本窗口没有调用 compare_geometry、inspect_object 或 list_objects；不能把框架中可用的工具理解为每次都执行了。</p>${code('run.py',61,'API / 工具循环')}${code('tools.py',41,'Tools.call()')}${code('state.py',23,'propose()')}`;}
if(stage===5){h=`<p>提交分支先根据提案中的归属，重新汇集每个物体的原始观测点并做体素化。第一窗全部是新物体，没有可复用的上一版本点云。</p><label>选择物体 <select id="objectSelect" aria-label="选择物体点云">${Object.entries(S.objects).map(([id,o])=>`<option value="${id}">${id} · ${esc(o.object_label)}</option>`).join('')}</select></label><div id="fusion"></div>${code('publish.py',15,'materialize()')}${code('observations.py',83,'Observations.fused()')}<p class="warn">这里使用实际版本 1 的 NPZ 点云。为便于浏览，每个物体最多显示 1,600 个点；数量统计来自完整数据。不同观测可能含重复点，输入点数不能当作独立表面点数。</p>`;}
if(stage===6){const pending=Object.entries(S.assignments).filter(([id,a])=>!a.object_id);h=`<p>点云文件生成成功后，主循环才把临时版本变成正式版本，并更新 checkpoint。</p><div class="flow"><span class="pill">versions/.0001.tmp</span><span class="arrow">→</span><span class="pill">versions/0001</span><span class="arrow">→</span><span class="pill">checkpoint：version 1 / cutoff 4</span></div><div class="stats"><div><b>${Object.keys(S.objects).length}</b>物体候选</div><div><b>${obs.length-pending.length}</b>已归属观测</div><div><b>${pending.length}</b>待定 / 需修复</div></div>${pending.map(([id,a])=>`<div class="card"><h3>${id} · ${esc(a.status)}</h3><p>${esc(a.reason)}</p><img style="max-height:220px" src="${D.observations[id].crop}" alt="未归属观测 ${id}"></div>`).join('')}${code('run.py',73,'提交分支：生成点云 → 目录改名 → checkpoint')}${code('state.py',9,'save()')}${detail('查看正式版本 1 状态',S)}<p class="muted">上方 checkpoint 是第一窗提交时的值；当前运行目录的最新 checkpoint 已推进到后面的窗口。</p>`;}
if(stage===7){h=`<p>程序输出物体记忆和点云，随后将下一窗口设为抽样 5–9。第一窗的物体候选、归属及代表视图会成为下一窗输入。</p><div class="flow"><span class="pill">窗口 0–4 的版本 1</span><span class="arrow">→</span><span class="pill">窗口 5–9 ＋ 历史物体</span><span class="arrow">→</span><span class="pill">再走步骤 04–08</span></div><div class="table"><table><tr><th>本窗口产物</th><th>内容</th></tr><tr><td><a href="versions/0001/state.json">versions/0001/state.json</a></td><td>物体、观测归属、关系</td></tr><tr><td><a href="versions/0001/transaction.json">versions/0001/transaction.json</a></td><td>修改单、理由、证据引用</td></tr><tr><td>versions/0001/clouds/O*.npz</td><td>每个物体的体素化表面点云</td></tr><tr><td><a href="versions/0001/timing.json">versions/0001/timing.json</a></td><td>本窗耗时与 API 轮数</td></tr></table></div>${code('publish.py',27,'publish()')}${code('run.py',91,'窗口收尾，继续外层循环')}<p class="warn">本页展示的是执行过程，不代表这些身份判断已通过真值核验。repair 仅做标记；没有自动重新分割 mask，也没有补全未观测表面。</p>`;}
$('content').innerHTML=h;document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{frame=+b.dataset.frame;render()});document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{tracked=b.dataset.track;$('traceSelect').value=tracked;trace()});if(stage===3){$('requestSelect').onchange=renderRequest;renderRequest()}if(stage===5){$('objectSelect').onchange=fusion;fusion()}trace();$('prev').disabled=stage===0;$('next').disabled=stage===7;}
function renderRequest(){
 const selected=+$('requestSelect').value,r=D.requests[selected],p=r.payload,parameters=Object.fromEntries(Object.entries(p).filter(([k])=>!['messages','tools'].includes(k)));
 const pre=v=>`<pre class="full-input">${esc(typeof v==='string'?v:JSON.stringify(v,null,2))}</pre>`;
 let h=`<details class="card"><summary>① 请求参数 · 全部顶层控制字段</summary>${pre(parameters)}<p class="muted">messages 与 tools 分别完整列在下方；这些是请求正文，不包含 HTTP 鉴权密钥。</p></details><details class="card"><summary>② messages · ${p.messages.length} 条消息，按实际顺序</summary><p class="muted">展开各级标题可查看完整文字和图片。没有把整帧标注图替换为原始 RGB，也没有省略中间的帧序号文字。</p>`;
 p.messages.forEach((m,mi)=>{
  h+=`<details class="card"><summary>messages[${mi}] · ${esc(m.role)}</summary>`;
  const metadata=Object.fromEntries(Object.entries(m).filter(([k])=>k!=='content'));
  h+=pre(metadata);
  if(Array.isArray(m.content))m.content.forEach((part,pi)=>{
   h+=`<details class="card"><summary>content[${pi}] · ${esc(part.type)}</summary>`;
   if(part.type==='text'){
    let parsed;try{parsed=JSON.parse(part.text)}catch{}
    if(parsed && parsed.new_observations){
     h+=`<p>同一个 text 块包含：窗口范围、当前记忆、全部 ${parsed.new_observations.length} 条新观测、调用预算。下方逐字段完整展示，JSON 仅增加缩进以便阅读。</p>`;
     h+=pre(parsed);
    }else h+=pre(part.text);
   }else if(part.type==='image_url'){
    h+=`<p>detail = <b>${esc(part.image_url.detail)}</b> · ${esc(part.transport.mime)} · ${part.transport.bytes.toLocaleString()} 字节</p><img class="hero" src="${esc(part.image_url.url)}" alt="第 ${selected+1} 轮消息 ${mi} 图片 ${pi}"><div class="code">SHA-256: ${esc(part.transport.sha256)}</div><p class="muted">实际传输形式：image_url.url = data:${esc(part.transport.mime)};base64,…。日志未保留编码字符串；这里展示对应的本地证据图片。上方大小与哈希由该证据文件计算。</p>`;
   }else h+=pre(part);
   h+='</details>';
  });else h+=pre(m.content);
  h+='</details>';
 });
 h+=`</details><details class="card"><summary>③ tools · 全部 ${p.tools.length} 个工具定义</summary><p>模型不仅收到工具名字，也收到 description、参数类型、required 和 additionalProperties。展开工具标题可查看完整定义。</p>${p.tools.map(t=>`<details class="card"><summary>${esc(t.function.name)}</summary>${pre(t)}</details>`).join('')}</details><p><a href="${esc(r.log)}">打开本轮原始请求 JSON（图片编码已被日志脱敏省略） ↗</a></p>`;
 $('requestContent').innerHTML=h;
}
function fusion(){const id=$('objectSelect').value,members=obs.filter(o=>S.assignments[o.id].object_id===id),cloud=D.clouds[id];$('fusion').innerHTML=`<div class="flow"><span class="pill">${members.length} 个 mask 观测</span><span class="arrow">→</span><span class="pill">${members.reduce((n,o)=>n+o.point_count,0).toLocaleString()} 个输入点</span><span class="arrow">→</span><span class="pill">${cloud.count.toLocaleString()} 个体素点</span></div><div class="crops">${members.map(o=>`<div><img src="${o.crop}" alt="${o.id}"><small>抽样 ${o.seq} · ${o.id}</small></div>`).join('')}</div><p>拖动旋转此物体；滚轮缩放。</p><canvas id="cloud" aria-label="物体三维点云预览"></canvas><p class="muted">显示 ${cloud.points.length} / ${cloud.count} 点。视角居中以便观察，点间相对几何未改变。</p>`;drawCloud(cloud.points);}
function drawCloud(points){const canvas=$('cloud'),ctx=canvas.getContext('2d');let yaw=.5,pitch=-.5,zoom=1,last=null;const lo=[0,1,2].map(k=>Math.min(...points.map(p=>p[k]))),hi=[0,1,2].map(k=>Math.max(...points.map(p=>p[k]))),mid=lo.map((x,i)=>(x+hi[i])/2),span=Math.max(...hi.map((x,i)=>x-lo[i]),.01);function draw(){canvas.width=Math.max(200,canvas.clientWidth)*devicePixelRatio;canvas.height=420*devicePixelRatio;ctx.fillStyle='#0c1821';ctx.fillRect(0,0,canvas.width,canvas.height);const scale=Math.min(canvas.width,canvas.height)*.68/span*zoom;const rotated=points.map(p=>{const x=p[0]-mid[0],y=p[1]-mid[1],z=p[2]-mid[2],a=x*Math.cos(yaw)-y*Math.sin(yaw),b=x*Math.sin(yaw)+y*Math.cos(yaw);return [a,b*Math.sin(pitch)+z*Math.cos(pitch),b*Math.cos(pitch)-z*Math.sin(pitch)]}).sort((a,b)=>a[2]-b[2]);rotated.forEach(p=>{ctx.fillStyle=`hsl(${160+30*p[2]/span} 75% ${60+18*p[2]/span}%)`;ctx.fillRect(canvas.width/2+p[0]*scale,canvas.height/2-p[1]*scale,2*devicePixelRatio,2*devicePixelRatio)});}canvas.onpointerdown=e=>{last=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(last){yaw+=(e.clientX-last[0])*.01;pitch+=(e.clientY-last[1])*.01;last=[e.clientX,e.clientY];draw()}};canvas.onpointerup=()=>last=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.3,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));draw()};draw();}
titles.forEach((t,i)=>{const b=document.createElement('button');b.textContent=`${String(i+1).padStart(2,'0')}  ${t}`;b.onclick=()=>{stage=i;render()};$('nav').append(b)});obs.forEach(o=>{const option=document.createElement('option');option.value=o.id;option.textContent=`${o.id} · ${o.category_label}`;$('traceSelect').append(option)});$('traceSelect').onchange=e=>{tracked=e.target.value;trace()};$('prev').onclick=()=>{stage--;render()};$('next').onclick=()=>{stage++;render()};render();
</script></body></html>
