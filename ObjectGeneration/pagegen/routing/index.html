<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生成路线判断 · 审查</title>
<style>
:root {
  --ink: #16191d; --ink-2: #454c55; --ink-3: #7a8390;
  --surface: #f8f9fa; --raised: #ffffff; --border: #dde1e6;
  --accent: #0f62fe; --accent-2: #e8f0fe;
  --dc: #8a3ffc; --dc-bg: #f1e9ff; --sam: #198038; --sam-bg: #e7f6ec;
  --warn: #b26a00; --warn-bg: #fff4e0;
  --radius: 6px; --radius-lg: 10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--surface); }
main { max-width: 1280px; margin: 0 auto; padding: 28px 24px 64px; display: flex; flex-direction: column; gap: 18px; }
h1 { font-size: 20px; font-weight: 600; }
h2 { font-size: 15px; font-weight: 600; }
.lede { color: var(--ink-2); max-width: 980px; }
.sub { color: var(--ink-3); font-size: 12.5px; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
.card { background: var(--raised); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 18px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat b { display: block; font-size: 20px; font-weight: 600; }
.stat span { color: var(--ink-3); font-size: 12px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 10px; padding: 0 8px; line-height: 20px; white-space: nowrap; }
.tag.dualcraft { color: var(--dc); background: var(--dc-bg); }
.tag.sam3d { color: var(--sam); background: var(--sam-bg); }
.tag.conf { color: var(--ink-2); background: var(--surface); border: 1px solid var(--border); }
.tag.warn { color: var(--warn); background: var(--warn-bg); }
.rule { border-left: 3px solid var(--accent); background: var(--accent-2); padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0; font-size: 13px; }

/* filters + stepping */
.bar-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips button { border: 1px solid var(--border); background: var(--raised); border-radius: 16px; padding: 3px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.bar-row input { border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 10px; font: inherit; font-size: 13px; width: 200px; }
.step { border: 1px solid var(--border); background: var(--raised); border-radius: var(--radius); padding: 3px 14px; font: inherit; font-size: 13px; cursor: pointer; }
.step:hover { background: var(--accent-2); }
.counter { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-2); min-width: 64px; text-align: center; }
.spacer { flex: 1; }

/* progress bar: one segment per object, coloured by route */
.track { display: flex; gap: 2px; height: 16px; }
.seg { flex: 1; border-radius: 2px; cursor: pointer; opacity: .3; transition: opacity .1s; }
.seg.dualcraft { background: var(--dc); }
.seg.sam3d { background: var(--sam); }
.seg.error { background: var(--ink-3); }
.seg.past { opacity: .85; }
.seg.current { opacity: 1; outline: 2px solid var(--ink); outline-offset: 1px; }
.seg:hover { opacity: 1; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }

/* the object */
.stage { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; }
.shot { display: flex; flex-direction: column; gap: 8px; }
.shot-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.toggle { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.toggle button { border: 0; background: var(--raised); padding: 3px 12px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.toggle button + button { border-left: 1px solid var(--border); }
.toggle button.on { background: var(--accent); color: #fff; }
.frame { background: #e9ecef; border: 1px solid var(--border); border-radius: var(--radius); height: 560px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.frame img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; display: block; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { border: 2px solid transparent; background: var(--raised); border-radius: var(--radius); padding: 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; }
.thumb img { height: 70px; display: block; border-radius: 3px; }
.thumb span { font-size: 11px; color: var(--ink-3); }
.thumb.on { border-color: var(--accent); }
.info { display: flex; flex-direction: column; gap: 12px; }
.info-head h3 { font-size: 17px; font-weight: 600; line-height: 1.4; }
.info-head .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 6px; }
.info-head .id { font-family: ui-monospace, monospace; color: var(--ink-3); font-size: 12.5px; }
dl.facts { display: grid; grid-template-columns: 80px 1fr; gap: 7px 12px; font-size: 13px; }
dl.facts dt { color: var(--ink-3); font-size: 12px; padding-top: 1px; }
.part { font-size: 13px; }
.part .motion { color: var(--dc); font-weight: 600; }
.part.inferred { color: var(--ink-3); }
.empty { padding: 40px; text-align: center; color: var(--ink-3); }
.stage[hidden], .empty[hidden] { display: none; }

/* overview table */
.table-wrap { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: auto; background: var(--raised); max-height: 520px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
thead th { background: var(--surface); font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--accent-2); }
tbody tr.current td { background: #dde8ff; }
td.id { font-family: ui-monospace, monospace; font-size: 12px; white-space: nowrap; }
.mismatch { color: var(--warn); }
.foot { font-size: 12px; color: var(--ink-3); }
#lightbox { position: fixed; inset: 0; background: rgba(10,12,15,.88); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; padding: 24px; }
#lightbox.open { display: flex; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: var(--radius); }
@media (max-width: 960px) { .stage { grid-template-columns: 1fr; } .frame { height: 420px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>生成路线判断</h1>
    <p class="lede" id="lede"></p>
  </header>
  <div class="stats" id="stats"></div>
  <div class="rule" id="rule"></div>

  <section class="card" style="display:flex;flex-direction:column;gap:12px" id="viewer">
    <div class="bar-row">
      <div class="chips" id="filters">
        <button data-f="all" class="on">全部</button>
        <button data-f="dualcraft">DualCraft</button>
        <button data-f="sam3d">SAM3D</button>
        <button data-f="medium">置信度非 high</button>
        <button data-f="mismatch">标签与照片不符</button>
        <button data-f="override">人工改判</button>
      </div>
      <input id="search" type="search" placeholder="按编号、标签或识别结果过滤…">
      <span class="spacer"></span>
      <button class="step" id="prev" title="上一个（←）">‹ 上一个</button>
      <span class="counter" id="counter"></span>
      <button class="step" id="next" title="下一个（→）">下一个 ›</button>
    </div>
    <div class="track" id="track"></div>
    <div class="legend"><span><i style="background:var(--dc)"></i>DualCraft</span><span><i style="background:var(--sam)"></i>SAM3D</span><span>点任一格跳到该物体；键盘 ← → 切换</span></div>
    <div class="empty" id="empty" hidden>没有符合条件的物体</div>
    <div class="stage" id="stage">
      <div class="shot">
        <div class="shot-head">
          <div class="toggle" id="viewToggle"><button data-v="crop" class="on">裁图</button><button data-v="full">原图</button></div>
          <span class="sub" id="caption"></span>
        </div>
        <div class="frame"><img id="shot" alt=""></div>
        <div class="thumbs" id="thumbs"></div>
      </div>
      <div class="info" id="info"></div>
    </div>
  </section>

  <section class="card" style="display:flex;flex-direction:column;gap:10px">
    <h2>总表</h2>
    <div class="table-wrap"><table id="table"></table></div>
    <p class="sub">随上方筛选变化；点击一行在上方显示该物体。「正面」列是模型认为最正对物体正面的关键帧号。</p>
  </section>

  <p class="foot" id="foot"></p>
</main>
<div id="lightbox"><img alt=""></div>

<script>
window.DATA = /*__DATA__*/null;
</script>
<script>
(function () {
"use strict";
const D = window.DATA;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MOTION = { hinged_door: "铰链门", drawer: "抽屉", lid_or_flap: "盖 / 翻板", sliding_door: "推拉门", knob_or_dial: "旋钮", other: "其他" };
const FACING = { toward_camera: "正对相机", left: "朝画面左", right: "朝画面右", away_from_camera: "背对相机", not_visible: "看不到正面" };
const ROUTE = { dualcraft: "DualCraft", sam3d: "SAM3D" };
const objects = D.objects;

/* header */
const counts = { dualcraft: 0, sam3d: 0 };
objects.forEach(o => { counts[o.route] = (counts[o.route] || 0) + 1; });
const usage = objects.reduce((a, o) => ({ i: a.i + (o.usage?.input || 0), o: a.o + (o.usage?.output || 0) }), { i: 0, o: 0 });
$("lede").innerHTML = `模型 <code>${esc(D.model)}</code> 对 <code>${esc(D.generation)}</code> 里 ${objects.length} 个已生成物体逐个判断：走 DualCraft（铰接，有门、抽屉、盖）还是 SAM3D（单个刚体）。每个物体一次调用，输入标签、扫描尺寸和关键帧裁图，按固定格式返回。结果在 <code>routing.json</code>（${esc(D.updated_at)}）。`;
$("stats").innerHTML = [
  [`${counts.dualcraft}`, "走 DualCraft"], [`${counts.sam3d}`, "走 SAM3D"],
  [`${objects.filter(o => o.confidence !== "high").length}`, "置信度不是 high"],
  [`${objects.filter(o => o.label_matches === false).length}`, "标签与照片不符"],
  [`${objects.filter(o => o.override).length}`, "人工改判"],
  [`${(usage.i / 1000).toFixed(0)}K / ${(usage.o / 1000).toFixed(1)}K`, "输入 / 输出 token（网关报数，输入计数不可靠）"],
].map(([b, s]) => `<div class="card stat"><b>${b}</b><span>${s}</span></div>`).join("");
$("rule").innerHTML = `<b>判断标准</b>（写进提示词）：有刚性可动部件、人要转动或拉开才能用的（铰链门、盖、抽屉、翻板、推拉门）走 DualCraft，固定在建筑上的柜子也算；布料软物、只有轮子或装饰性活动件的、对「打开」不重要的小部件（烤面包机压杆、键盘托）走 SAM3D。按照片判断，不按标签。`;

const partsText = o => {
  const sums = new Map();
  for (const p of o.moving_parts || []) {
    const key = (MOTION[p.motion] || p.motion) + (p.visible ? "" : "（推断）");
    sums.set(key, (sums.get(key) || 0) + p.count);
  }
  return [...sums].map(([k, n]) => `${n}× ${k}`).join("、") || "—";
};

/* state */
let list = [], index = 0, view = "crop", shownSeq = null, filter = "all", query = "";
const routeOrder = o => (o.route === "dualcraft" ? 0 : o.route === "sam3d" ? 1 : 2);
const matches = o =>
  (filter === "all" || o.route === filter
    || (filter === "medium" && o.confidence !== "high") || (filter === "mismatch" && o.label_matches === false)
    || (filter === "override" && o.override))
  && (!query || [o.object_id, o.label, o.identity].some(v => String(v || "").toLowerCase().includes(query)));

function refresh(keepId) {
  list = objects.filter(matches).sort((a, b) => routeOrder(a) - routeOrder(b) || a.object_id.localeCompare(b.object_id));
  const at = keepId ? list.findIndex(o => o.object_id === keepId) : -1;
  $("track").innerHTML = list.map((o, i) =>
    `<div class="seg ${o.route || "error"}" data-i="${i}" title="${o.object_id} ${esc(o.label)} → ${ROUTE[o.route] || "错误"}"></div>`).join("");
  renderTable();
  show(at >= 0 ? at : 0);
}

function show(i) {
  $("empty").hidden = list.length > 0;
  $("stage").hidden = list.length === 0;
  if (!list.length) {
    $("counter").textContent = "0 / 0";
    $("prev").disabled = $("next").disabled = true;
    return;
  }
  index = Math.max(0, Math.min(list.length - 1, i));
  const o = list[index];
  shownSeq = o.representative.seq;
  $("track").querySelectorAll(".seg").forEach((s, k) => {
    s.classList.toggle("past", k < index);
    s.classList.toggle("current", k === index);
  });
  $("counter").textContent = `${index + 1} / ${list.length}`;
  $("prev").disabled = index === 0;
  $("next").disabled = index === list.length - 1;
  renderShot(o);
  renderInfo(o);
  $("table").querySelectorAll("tbody tr").forEach(tr => tr.classList.toggle("current", tr.dataset.id === o.object_id));
  history.replaceState(null, "", "#" + o.object_id);
  for (const k of [index - 1, index + 1]) {           // warm the neighbours' representative frames
    const n = list[k];
    const im = n && n.images.find(x => x.seq === n.representative.seq);
    if (im) new Image().src = im[view];
  }
}

function renderShot(o) {
  const im = o.images.find(x => x.seq === shownSeq) || o.images[0];
  if (!im) {
    $("shot").removeAttribute("src");
    $("caption").textContent = "没有发给模型的帧";
    $("thumbs").innerHTML = "";
    return;
  }
  $("shot").src = im[view];
  const isRep = im.seq === o.representative.seq;
  let why = "";
  if (isRep) {
    why = o.representative.from_front ? "代表帧：模型判断最正对正面的一帧"
      : (o.front && o.front.best_image === 0 ? "代表帧：模型认为没有一帧显示正面，取第一张" : "代表帧：发给模型的第一张");
  }
  $("caption").textContent = [`seq ${im.seq}`, im.role,
    im.out_of_picture != null ? `${Math.round(im.out_of_picture * 100)}% 在画面外` : "", why].filter(Boolean).join(" · ");
  $("thumbs").innerHTML = o.images.length > 1 ? o.images.map(x =>
    `<button class="thumb ${x.seq === im.seq ? "on" : ""}" data-seq="${x.seq}"><img src="${x.crop}" alt="">` +
    `<span>seq ${x.seq}${x.seq === o.representative.seq ? " · 代表帧" : ""}</span></button>`).join("") : "";
}

function renderInfo(o) {
  const crops = o.images.length;
  let front = "—";
  if (o.front) {
    const b = o.front.best_image;
    const which = b === 0 ? "没有一帧显示正面" : b === crops + 1 ? `第一张关键帧的原图（seq ${o.front.seq}）` : `seq ${o.front.seq}（发给模型的第 ${b} 张）`;
    front = `${which}，${FACING[o.front.facing] || esc(o.front.facing)}<br><span class="sub">${esc(o.front.cue)}</span>`;
  }
  const parts = (o.moving_parts || []).length ? o.moving_parts.map(p =>
    `<div class="part ${p.visible ? "" : "inferred"}">${p.count}× <span class="motion">${MOTION[p.motion] || esc(p.motion)}</span> ${esc(p.part)}${p.visible ? "" : "（推断，照片里没看到）"}</div>`).join("") : "无";
  const s = o.scan_size_m || {};
  const dropped = (o.dropped || []).length ? o.dropped.map(d => `seq ${d.seq}：${esc(d.reason)}`).join("<br>") : "—";
  $("info").innerHTML = `
    <div class="info-head">
      <h3>${esc(o.identity || o.label)}</h3>
      <div class="meta"><span class="id">${o.object_id} · 标签 ${esc(o.label)}${o.label_quality === "generic" ? "（泛称）" : ""}</span>
        <span class="tag ${o.route || "warn"}">${ROUTE[o.route] || "错误"}</span>
        ${o.override ? `<span class="tag warn">人工改判（模型判 ${ROUTE[o.model_route] || esc(o.model_route)}）</span>` : ""}
        <span class="tag ${o.confidence === "high" ? "conf" : "warn"}">置信度 ${esc(o.confidence)}</span>
        ${o.label_matches === false ? '<span class="tag warn">标签与照片不符</span>' : ""}
        ${(o.problems || []).map(p => `<span class="tag warn">${esc(p)}</span>`).join("")}</div>
    </div>
    <dl class="facts">
      ${o.override ? `<dt>人工改判</dt><dd>${esc(o.override.note || "")}<br><span class="sub">下面是模型的原判断（${ROUTE[o.model_route] || esc(o.model_route)}）。改判写在 routing_overrides.json，重跑模型也保留。</span></dd>` : ""}
      <dt>理由</dt><dd>${esc(o.reasoning || o.error)}</dd>
      <dt>可动部件</dt><dd>${parts}</dd>
      <dt>正面</dt><dd>${front}</dd>
      <dt>扫描尺寸</dt><dd>${s.long?.toFixed(2)} × ${s.short?.toFixed(2)} m 占地，高 ${s.height?.toFixed(2)} m · ${s.points} 点</dd>
      <dt>未发的帧</dt><dd class="sub">${dropped}</dd>
      <dt>调用</dt><dd class="sub">${esc(o.model)} · ${o.seconds}s · ${o.usage?.input ?? "?"} / ${o.usage?.output ?? "?"} token</dd>
    </dl>`;
}

function renderTable() {
  const rows = list.map(o => `<tr data-id="${o.object_id}">
    <td class="id">${o.object_id}</td>
    <td>${esc(o.label)}${o.label_quality === "generic" ? ' <span class="sub">(泛称)</span>' : ""}</td>
    <td class="${o.label_matches === false ? "mismatch" : ""}">${esc(o.identity)}</td>
    <td><span class="tag ${o.route}">${ROUTE[o.route] || "错误"}</span>${o.override ? ' <span class="tag warn">人工</span>' : ""}</td>
    <td><span class="tag ${o.confidence === "high" ? "conf" : "warn"}">${esc(o.confidence)}</span></td>
    <td>${esc(partsText(o))}</td>
    <td class="id">${o.front?.seq ?? "—"}</td></tr>`).join("");
  $("table").innerHTML = `<thead><tr><th>编号</th><th>扫描标签</th><th>模型认出的物体</th><th>路线</th><th>置信度</th><th>可动部件</th><th>正面</th></tr></thead><tbody>${rows}</tbody>`;
}

/* events */
$("track").addEventListener("click", e => { const s = e.target.closest(".seg"); if (s) show(+s.dataset.i); });
$("prev").addEventListener("click", () => show(index - 1));
$("next").addEventListener("click", () => show(index + 1));
$("thumbs").addEventListener("click", e => {
  const t = e.target.closest(".thumb"); if (!t) return;
  shownSeq = +t.dataset.seq; renderShot(list[index]);
});
$("viewToggle").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v;
  for (const x of $("viewToggle").querySelectorAll("button")) x.classList.toggle("on", x === b);
  renderShot(list[index]);
});
$("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  for (const x of $("filters").querySelectorAll("button")) x.classList.toggle("on", x === b);
  refresh(list[index]?.object_id);
});
$("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); refresh(list[index]?.object_id); });
$("table").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-id]"); if (!tr) return;
  show(list.findIndex(o => o.object_id === tr.dataset.id));
  $("viewer").scrollIntoView({ behavior: "smooth", block: "start" });
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft") { show(index - 1); e.preventDefault(); }
  if (e.key === "ArrowRight") { show(index + 1); e.preventDefault(); }
  if (e.key === "Escape") $("lightbox").classList.remove("open");
});
$("shot").addEventListener("click", () => { $("lightbox").querySelector("img").src = $("shot").src; $("lightbox").classList.add("open"); });
$("lightbox").addEventListener("click", () => $("lightbox").classList.remove("open"));

$("foot").innerHTML = `由 <code>scripts/tools/build_routing_page.py</code> 从 <code>routing.json</code> 生成，帧图片在旁边的 <code>frames/</code>。判断脚本 <code>scripts/tools/route_generators.py</code>，裁图规则同 <code>scripts/pipeline/prepare_dualcraft_inputs.py</code>；图上的黄框是为了审查加的，模型看到的裁图没有框。生成与导出的整体方案见 <a href="../generation/index.html">物体生成与导出方案</a>。`;

refresh(decodeURIComponent(location.hash.slice(1)) || null);
})();
</script>
</body>
</html>
